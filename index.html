<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lounge Finder – Elite Assist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page-bg:      #EDE8E2;
      --bg:           #FFFFFF;
      --bg-warm:      #FAF7F2;
      --primary:      #A8854C;
      --primary-dk:   #8A6A35;
      --primary-lt:   #FBF5E8;
      --cream:        #F7EDD5;
      --cream-bd:     #E8D5A0;
      --text:         #1A1614;
      --text-2:       #5C5752;
      --muted:        #A09890;
      --border:       #E8E3DA;
      --r-sm:  10px;
      --r-md:  16px;
      --r-lg:  20px;
      --r-xl:  24px;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--page-bg);
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 48px;
    }

    /* ═══ Page Container ═══ */
    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg);
      border-radius: var(--r-xl);
      overflow: hidden;
      box-shadow: 0 8px 48px rgba(0,0,0,0.10);
    }

    /* ═══ Header ═══ */
    header {
      padding: 0 32px;
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .brand { display: flex; align-items: center; }
    .brand-logo { color: var(--primary); display: block; line-height: 1; }
    .brand-logo img { display: block; }

    /* ═══ Main body ═══ */
    .main-body { padding: 32px 40px 40px; }

    /* ═══ Selector bar ═══ */
    .selector-bar {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .selector-field { flex: 1; min-width: 220px; }
    .selector-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }
    .select-wrap {
      position: relative;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      padding: 0 44px 0 18px;
      height: 52px;
      transition: border-color 0.15s;
    }
    .select-wrap:focus-within { border-color: var(--primary); }
    .select-wrap select {
      flex: 1;
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }
    .select-wrap select:disabled { color: var(--muted); cursor: not-allowed; }
    .select-chevron {
      position: absolute;
      right: 18px;
      width: 14px;
      height: 14px;
      color: var(--muted);
      pointer-events: none;
    }

    /* ═══ Card perk banner ═══ */
    .card-perk-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--cream);
      border: 1.5px solid var(--cream-bd);
      border-radius: var(--r-md);
      padding: 12px 18px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--text-2);
      font-weight: 500;
    }
    .card-perk-banner strong { color: var(--text); font-weight: 700; }
    .tier-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; }
    .tier-dot.private { background: #17130F; box-shadow: 0 0 0 2px #C9A15E inset; }

    /* ═══ Terminal filter ═══ */
    .filter-groups { margin-bottom: 24px; }
    .filter-group-label { font-size: 12px; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
    .radio-pills { display: flex; flex-wrap: wrap; gap: 8px; }
    .radio-pill {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 14px; font-weight: 500; color: var(--text-2);
      background: var(--bg);
    }
    .radio-pill:hover { border-color: var(--cream-bd); background: var(--cream); color: var(--text); }
    .radio-pill.active { border-color: var(--primary); background: var(--cream); color: var(--text); }
    .radio-circle {
      width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; transition: border-color 0.15s;
    }
    .radio-pill.active .radio-circle { border-color: var(--primary); }
    .radio-dot { width: 9px; height: 9px; background: var(--primary); border-radius: 50%; display: none; }
    .radio-pill.active .radio-dot { display: block; }

    /* ═══ Results ═══ */
    .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .results-title { font-size: 16px; font-weight: 700; }
    .results-count { font-size: 13px; color: var(--muted); }

    .lounge-list { display: flex; flex-direction: column; gap: 14px; }

    .lrow {
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
    }
    .lrow:hover { box-shadow: var(--shadow-md); border-color: var(--cream-bd); transform: translateY(-1px); }
    .lrow-img-wrap { position: relative; width: 92px; height: 92px; border-radius: var(--r-md); overflow: hidden; flex-shrink: 0; background: #ddd; }
    .lrow-img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 0.3s; }
    .lrow-img.loaded { opacity: 1; }
    .lrow-img-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, #ddd8d0 25%, #eae5dd 50%, #ddd8d0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      transition: opacity 0.3s;
    }
    .lrow-img-shimmer.gone { opacity: 0; pointer-events: none; }
    .lrow-badge {
      position: absolute; bottom: 6px; left: 6px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 2px 7px; border-radius: 5px;
    }
    .lrow-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .lrow-name { font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.25; }
    .lrow-loc { font-size: 12px; color: var(--text-2); line-height: 1.4; }
    .lrow-amenities { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
    .lrow-amenity { width: 20px; height: 20px; color: var(--primary); flex-shrink: 0; }
    .lrow-amenity svg { width: 100%; height: 100%; }
    .lrow-cta {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--primary); color: #fff;
      padding: 12px 26px; border-radius: var(--r-sm);
      font-size: 13px; font-weight: 700; text-decoration: none;
      transition: background 0.15s;
    }
    .lrow-cta:hover { background: var(--primary-dk); }
    .lrow-cta svg { width: 14px; height: 14px; }

    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .empty-state { text-align: center; padding: 80px 32px; color: var(--muted); }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.35; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text-2); }
    .empty-state p { font-size: 13px; }

    /* ═══ Responsive ═══ */
    @media (max-width: 900px) {
      header, .main-body { padding-left: 24px; padding-right: 24px; }
    }
    @media (max-width: 600px) {
      body { padding: 10px 8px 32px; }
      header, .main-body { padding-left: 16px; padding-right: 16px; }
      .selector-bar { flex-direction: column; gap: 14px; }
      .lrow { flex-wrap: wrap; }
      .lrow-body { min-width: 160px; }
      .lrow-cta { width: 100%; }
    }
  </style>
</head>

/* ══════════════════════════════════════
   LOUNGE THUMBNAIL IMAGES
══════════════════════════════════════ */
const LOUNGE_IMGS = [
  'https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=200&h=200&q=75',
  'https://images.unsplash.com/photo-1551882547-ff40c599fb74?auto=format&fit=crop&w=200&h=200&q=75',

];

/* ══════════════════════════════════════
   AMENITIES
══════════════════════════════════════ */
const AMENITIES = [
  { label:'Recliners', svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18h14M5 18l-2 4M19 18l2 4M7 5h10a2 2 0 012 2v11H5V7a2 2 0 012-2zM12 5V2M9 2h6"/></svg>` },
  { label:'TV',        svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 20h8M12 18v2"/></svg>` },
  { label:'Newspapers',svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12M3 14h6M3 18h6"/></svg>` },
  { label:'Wi-Fi',     svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9C5.9 5 9.7 3 12 3s6.1 2 10 6M5.5 12.5C8 10 10 9 12 9s4 1 6.5 3.5M8.5 16C9.7 14.7 10.8 14 12 14s2.3.7 3.5 2"/><circle cx="12" cy="20" r="1.2" fill="currentColor" stroke="none"/></svg>` },
  { label:'Buffet',    svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2v20M15 5a3 3 0 006 0V2M6 2v6M4 2v6M8 2v6M6 8a2 2 0 002 2v10M4 10a2 2 0 002-2"/></svg>` },
  { label:'Charging',  svg:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 4.5 13.5 11 13.5 11 22 19.5 10.5 13 10.5 13 2"/></svg>` },
];

function h32(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h;
}

/* ══════════════════════════════════════
   CARD CATALOG
══════════════════════════════════════ */
const CARD_CATALOG = {
  credit: [
    { id: 'elite-select-credit',  name: 'Elite Select Credit Card',  tier: 'select',  perk: 'Enjoy 2 complimentary domestic lounge visits every quarter.' },
    { id: 'elite-private-credit', name: 'Elite Private Credit Card', tier: 'private', perk: 'Enjoy 4 complimentary visits per quarter, plus one guest, at domestic & international lounges.' },
  ],
  debit: [
    { id: 'elite-platinum-debit',  name: 'Elite Platinum Debit Card',  tier: 'select',  perk: 'Enjoy 1 complimentary domestic lounge visit every quarter.' },
    { id: 'elite-signature-debit', name: 'Elite Signature Debit Card', tier: 'private', perk: 'Enjoy 2 complimentary visits per quarter at domestic & international lounges.' },
  ],
};

function findCard(type, id) {
  return (CARD_CATALOG[type] || []).find(c => c.id === id) || null;
}

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let selCard     = null;
let selCity     = null;
let selTerminal = 'all';

function eligibleLounges() {
  if (!selCard) return [];
  return selCard.tier === 'private' ? lounges : lounges.filter(l => l.type === 'domestic');
}

function eligibleCities() {
  return [...new Set(eligibleLounges().map(l => l.city))].sort();
}

/* ══════════════════════════════════════
   ELEMENT REFS
══════════════════════════════════════ */
const cardTypeSelect  = document.getElementById('cardTypeSelect');
const cardNameSelect  = document.getElementById('cardNameSelect');
const citySelect      = document.getElementById('citySelect');
const cardPerkBanner  = document.getElementById('cardPerkBanner');
const cardPerkText    = document.getElementById('cardPerkText');
const tierDot         = document.getElementById('tierDot');
const terminalGroup   = document.getElementById('terminalGroup');
const terminalPills   = document.getElementById('terminalPills');
const resultsTitle    = document.getElementById('resultsTitle');
const resultsCount    = document.getElementById('resultsCount');
const loungeList      = document.getElementById('loungeList');

/* ══════════════════════════════════════
   CARD TYPE / NAME
══════════════════════════════════════ */
cardTypeSelect.addEventListener('change', () => {
  const type = cardTypeSelect.value;
  const cards = CARD_CATALOG[type] || [];
  cardNameSelect.innerHTML = '<option value="" disabled selected>Select card name</option>' +
    cards.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  cardNameSelect.disabled = !type;
  clearCardSelection();
});

cardNameSelect.addEventListener('change', () => {
  const match = findCard(cardTypeSelect.value, cardNameSelect.value);
  selCard = match;
  selCity = null;
  selTerminal = 'all';

  if (match) {
    cardPerkBanner.style.display = 'flex';
    tierDot.className = 'tier-dot' + (match.tier === 'private' ? ' private' : '');
    cardPerkText.innerHTML = `<strong>${match.name}:</strong> ${match.perk}`;

    const cities = eligibleCities();
    citySelect.innerHTML = '<option value="" disabled selected>Select an airport</option>' +
      cities.map(c => `<option value="${c}">${c}</option>`).join('');
    citySelect.disabled = false;
  } else {
    clearCardSelection();
  }
  renderTerminalFilter();
  renderResults();
});

function clearCardSelection() {
  selCard = null;
  selCity = null;
  selTerminal = 'all';
  cardPerkBanner.style.display = 'none';
  citySelect.innerHTML = '<option value="" disabled selected>Select your card first</option>';
  citySelect.disabled = true;
  renderTerminalFilter();
  renderResults();
}

/* ══════════════════════════════════════
   AIRPORT / CITY
══════════════════════════════════════ */
citySelect.addEventListener('change', () => {
  selCity = citySelect.value || null;
  selTerminal = 'all';
  renderTerminalFilter();
  renderResults();
});

function renderTerminalFilter() {
  if (!selCard || !selCity) { terminalGroup.style.display = 'none'; return; }
  const cityLounges = eligibleLounges().filter(l => l.city === selCity);
  const terminals = [...new Set(cityLounges.map(l => l.terminal))].sort();

  if (terminals.length > 1) {
    terminalGroup.style.display = '';
    terminalPills.innerHTML = [
      { val:'all', label:'All Terminals' },
      ...terminals.map(t => ({ val: t, label: 'Terminal ' + t.replace('T','') }))
    ].map(o => `
      <label class="radio-pill ${selTerminal === o.val ? 'active' : ''}" data-val="${o.val}">
        ${o.label}
        <span class="radio-circle"><span class="radio-dot"></span></span>
      </label>`).join('');
  } else {
    terminalGroup.style.display = 'none';
  }
}

terminalPills.addEventListener('click', e => {
  const pill = e.target.closest('.radio-pill');
  if (!pill) return;
  selTerminal = pill.dataset.val;
  renderTerminalFilter();
  renderResults();
});

/* ══════════════════════════════════════
   RESULTS — LOUNGE LIST
══════════════════════════════════════ */
function renderLoungeRow(l) {
  const key = l.city + l.name;
  const imgUrl = LOUNGE_IMGS[h32(key) % LOUNGE_IMGS.length];
  const shId = 'lsh-' + h32(key);
  const gateLabel = l.gate === 'both' ? 'Dep & Arrival' : l.gate.charAt(0).toUpperCase() + l.gate.slice(1);
  const locLine = `${l.airport} · ${gateLabel} · ${l.terminal} · ${l.location.charAt(0).toUpperCase() + l.location.slice(1)}`;

  return `
  <div class="lrow">
    <div class="lrow-img-wrap">
      <div class="lrow-img-shimmer" id="${shId}"></div>
      <img class="lrow-img" src="${imgUrl}" alt="${l.name}"
        onload="this.classList.add('loaded');document.getElementById('${shId}').classList.add('gone')"
        onerror="document.getElementById('${shId}').classList.add('gone')" />
      <span class="lrow-badge">${l.type === 'domestic' ? 'Domestic' : 'International'}</span>
    </div>
    <div class="lrow-body">
      <div class="lrow-name">${l.name}</div>
      <div class="lrow-loc">${locLine}</div>
      <div class="lrow-amenities">
        ${AMENITIES.map(a => `<span class="lrow-amenity" title="${a.label}">${a.svg}</span>`).join('')}
      </div>
    </div>
    <a href="${l.url}" target="_blank" rel="noopener" class="lrow-cta">
      Book
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </a>
  </div>`;
}

function renderResults() {
  if (!selCard) {
    resultsTitle.textContent = 'Select your card and airport';
    resultsCount.textContent = '';
    loungeList.innerHTML = '';
    return;
  }
  if (!selCity) {
    resultsTitle.textContent = 'Select an airport';
    resultsCount.textContent = '';
    loungeList.innerHTML = `<div class="empty-state">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 21c-4-4-7-7.5-7-11.5A7 7 0 0119 9.5C19 13.5 16 17 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <h3>Choose an airport</h3>
      <p>Pick an airport above to see lounges available with your card.</p>
    </div>`;
    return;
  }

  let result = eligibleLounges().filter(l => l.city === selCity);
  if (selTerminal !== 'all') result = result.filter(l => l.terminal === selTerminal);

  const n = result.length;
  resultsTitle.textContent = `Lounges in ${selCity}`;
  resultsCount.textContent = `${n} lounge${n !== 1 ? 's' : ''} found`;

  if (!n) {
    loungeList.innerHTML = `<div class="empty-state">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <h3>No lounges found</h3>
      <p>Try adjusting your filters or selecting a different terminal.</p>
    </div>`;
    return;
  }

  loungeList.innerHTML = result.map(renderLoungeRow).join('');
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
renderResults();
</script>
