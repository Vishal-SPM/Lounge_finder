<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Elite Assist · Lounge Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Logo file referenced from JSX; flag it for the bundler. -->
  <meta name="ext-resource-dependency" content="./elite-assist-logo.png" data-resource-id="logo" />

  <!-- Splash shown while the bundled file unpacks; also no-JS fallback. -->
  <template id="__bundler_thumbnail" data-bg-color="#FAFAFA">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#FAFAFA"></rect>
      <g transform="translate(600 370)" fill="none" stroke="#A8854C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -150 L110 150 L0 105 L-110 150 Z"></path>
      </g>
      <text x="600" y="610" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="600" letter-spacing="10" fill="#171717">LOUNGE FINDER</text>
      <text x="600" y="656" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" letter-spacing="6" fill="#A8854C">ELITE ASSIST</text>
    </svg>
  </template>

  <style>
    :root {
      /* Brand tokens — from Figma */
      --bg:        #FFFFFF;
      --bg-soft:   #FAFAFA;
      --tile:      #FAF6EC;
      --line:      #F3EAD0;
      --gold:      #A8854C;
      --gold-dk:   #8A6A35;
      --gold-deep: #6E5520;
      --ink:       #171717;
      --ink-2:     #525252;
      --ink-3:     #A3A3A3;
      --brown:     #241B10;   /* dark hero, from landing artwork */
      --brown-2:   #382914;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg-soft);
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }

    .lf2-page { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Photo helper ── */
    .lf2-photo { position: relative; overflow: hidden; background: var(--tile); }
    .lf2-photo img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* ── Header ── */
    .lf2-header {
      position: sticky; top: 0; z-index: 40;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .lf2-header-inner {
      max-width: 1240px;
      margin: 0 auto;
      height: 72px;
      padding: 0 32px;
      display: flex; align-items: center; gap: 20px;
    }
    .lf2-logo { height: 38px; width: auto; display: block; }
    .lf2-header-rule { width: 1px; height: 32px; background: var(--line); }
    .lf2-airport-btn {
      display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      background: transparent; border: 0; padding: 8px 12px;
      border-radius: 10px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .lf2-airport-btn:hover { background: var(--tile); }
    .lf2-airport-name {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 16px; font-weight: 600; color: var(--ink);
      letter-spacing: -0.01em;
    }
    .lf2-airport-name svg { color: var(--ink-2); }
    .lf2-airport-meta {
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--gold);
    }
    .lf2-header-spacer { flex: 1; }
    .lf2-icon-btn {
      width: 40px; height: 40px; border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .lf2-icon-btn:hover { background: var(--tile); color: var(--gold); }

    /* ── Main ── */
    .lf2-main {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 32px 56px;
      flex: 1;
    }

    /* ── Dark hero banner ── */
    .lf2-hero {
      position: relative;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 24px;
      background:
        radial-gradient(90% 140% at 100% 0%, rgba(168,133,76,0.35) 0%, transparent 55%),
        radial-gradient(60% 100% at 0% 100%, rgba(168,133,76,0.16) 0%, transparent 55%),
        linear-gradient(160deg, var(--brown-2) 0%, var(--brown) 60%);
      border-radius: 16px;
      padding: 36px 40px;
      overflow: hidden;
      color: #FFF8EC;
    }
    .lf2-hero::after {
      content: '';
      position: absolute; right: -60px; top: -60px;
      width: 220px; height: 220px;
      border: 1px solid rgba(243,234,208,0.18);
      border-radius: 50%;
      pointer-events: none;
    }
    .lf2-hero-eyebrow {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: #D9BC7C;
      margin-bottom: 12px;
    }
    .lf2-hero-title {
      margin: 0;
      font-family: "DM Serif Display", Georgia, serif;
      font-weight: 400;
      font-size: 36px;
      line-height: 1.12;
      letter-spacing: 0.01em;
      max-width: 640px;
      text-wrap: balance;
    }
    .lf2-hero-sub {
      margin: 14px 0 0;
      font-size: 14px; line-height: 1.55;
      color: rgba(255,248,236,0.72);
      max-width: 440px;
      text-wrap: pretty;
    }
    .lf2-hero-change {
      flex-shrink: 0;
      height: 44px; padding: 0 20px;
      border-radius: 8px;
      border: 1px solid rgba(243,234,208,0.35);
      background: rgba(255,248,236,0.06);
      color: #F3EAD0;
      font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .lf2-hero-change:hover { background: rgba(255,248,236,0.12); border-color: rgba(243,234,208,0.6); }

    /* ── Filters ── */
    .lf2-filters {
      display: flex; gap: 36px; flex-wrap: wrap;
      padding: 24px 4px 20px;
    }
    .lf2-filter-group { display: flex; align-items: center; gap: 14px; }
    .lf2-filter-label {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink-2);
    }
    .lf2-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .lf2-pill {
      height: 38px; padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink-2);
      font-family: inherit; font-size: 13.5px; font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lf2-pill:hover { background: var(--tile); color: var(--ink); }
    .lf2-pill.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #FFFFFF;
    }

    /* ── Lounge cards (grid) ── */
    .lf2-lounge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .lf2-lounge-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 4px;
      display: flex; flex-direction: column;
      transition: box-shadow 0.18s ease, transform 0.18s ease, border-color 0.18s;
    }
    .lf2-lounge-card:hover {
      transform: translateY(-2px);
      border-color: #E8D5A0;
      box-shadow: 0 8px 28px rgba(168,133,76,0.14);
    }
    .lf2-lounge-imgwrap { position: relative; }
    .lf2-lounge-img { height: 168px; border-radius: 12px; }
    .lf2-lounge-img img { border-radius: 12px; }
    .lf2-lounge-card:hover .lf2-lounge-img img { transform: scale(1.04); }
    .lf2-badge {
      position: absolute; top: 10px; left: 10px;
      display: inline-flex; align-items: center;
      padding: 4px 8px;
      background: var(--gold);
      border: 2px solid var(--line);
      border-radius: 4px;
      font-size: 12px; font-weight: 600; line-height: 16px;
      letter-spacing: -0.01em;
      color: #FFFFFF;
    }
    .lf2-lounge-body {
      padding: 14px 14px 12px;
      display: flex; flex-direction: column;
      flex: 1;
    }
    .lf2-lounge-name {
      font-size: 16.5px; font-weight: 600;
      line-height: 1.25;
      color: var(--ink);
      letter-spacing: -0.01em;
      text-wrap: balance;
    }
    .lf2-lounge-meta {
      margin-top: 5px;
      font-size: 13px; line-height: 1.45;
      color: var(--ink-2);
    }
    .lf2-amenities {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      margin-top: 14px;
      padding: 12px 2px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .lf2-amenity {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      color: var(--gold);
    }
    .lf2-amenity span:last-child {
      font-size: 9.5px; font-weight: 500;
      color: var(--ink-3);
      letter-spacing: 0.02em;
    }

    /* ── Gold button ── */
    .lf2-btn-gold {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 20px;
      margin-top: 14px;
      width: 100%;
      border-radius: 8px;
      border: 0;
      background: var(--gold);
      color: #FFFFFF;
      font-family: inherit; font-size: 14px; font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s;
    }
    .lf2-btn-gold:hover { background: var(--gold-dk); }
    .lf2-btn-sm { height: 38px; padding: 0 16px; font-size: 13px; width: auto; margin-top: 0; }
    .lf2-btn-fit { width: auto; }

    /* ── Lounge rows (list) ── */
    .lf2-lounge-rows { display: flex; flex-direction: column; gap: 12px; }
    .lf2-lounge-row {
      display: flex; align-items: center; gap: 18px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 18px 12px 12px;
      transition: box-shadow 0.18s ease, border-color 0.18s;
    }
    .lf2-lounge-row:hover {
      border-color: #E8D5A0;
      box-shadow: 0 6px 20px rgba(168,133,76,0.12);
    }
    .lf2-row-img { width: 128px; height: 86px; border-radius: 12px; flex-shrink: 0; }
    .lf2-row-img img { border-radius: 12px; }
    .lf2-row-main { flex: 1; min-width: 0; }
    .lf2-row-amenities { display: flex; gap: 12px; margin-top: 10px; color: var(--gold); }
    .lf2-amenity-mini { display: flex; }
    .lf2-row-side {
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
      flex-shrink: 0;
    }
    .lf2-chip {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 12px; font-weight: 600;
      color: var(--gold-dk);
    }

    /* ── Empty state ── */
    .lf2-empty {
      text-align: center;
      padding: 90px 20px 60px;
      display: flex; flex-direction: column; align-items: center;
    }
    .lf2-empty-small { padding: 56px 20px 30px; }
    .lf2-empty-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--tile);
      border: 1px solid var(--line);
      color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
    }
    .lf2-empty-title { font-size: 20px; font-weight: 600; color: var(--ink); }
    .lf2-empty-sub { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
    .lf2-empty .lf2-btn-gold { margin-top: 22px; }

    /* ── Footer ── */
    .lf2-footer {
      text-align: center;
      padding: 22px 0 30px;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink-3);
    }

    /* ── Select Airport modal (Figma spec: 560px, #FAFAFA, #F3EAD0, r16, p40) ── */
    .lf2-modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(23,23,23,0.40);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      animation: lf2-fade 0.18s ease;
    }
    @keyframes lf2-fade { from { opacity: 0; } to { opacity: 1; } }
    .lf2-modal {
      display: flex; flex-direction: column;
      gap: 32px;
      width: 560px; max-width: 100%;
      max-height: min(696px, calc(100vh - 48px));
      padding: 40px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(23,23,23,0.18);
      animation: lf2-pop 0.22s cubic-bezier(.2,.7,.3,1.1);
    }
    @keyframes lf2-pop { from { opacity: 0; transform: translateY(10px) scale(0.985); } to { opacity: 1; transform: none; } }
    .lf2-modal-head { display: flex; align-items: flex-start; gap: 32px; }
    .lf2-modal-titles { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .lf2-modal-title {
      font-size: 18px; font-weight: 500; line-height: 28px;
      color: var(--ink);
    }
    .lf2-modal-desc {
      font-size: 14px; font-weight: 400; line-height: 20px;
      color: var(--ink-2);
    }
    .lf2-modal-x {
      width: 24px; height: 24px;
      border: 0; padding: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .lf2-modal-search {
      display: flex; align-items: center; gap: 8px;
      height: 48px;
      padding: 12px 16px 12px 12px;
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: 8px;
      transition: border-color 0.15s;
    }
    .lf2-modal-search:focus-within { border-color: var(--gold); }
    .lf2-modal-search-icon { color: var(--ink-3); display: flex; flex-shrink: 0; }
    .lf2-modal-search input {
      flex: 1; min-width: 0;
      border: 0; outline: 0; background: transparent;
      font-family: inherit; font-size: 14px; line-height: 20px;
      color: var(--ink);
    }
    .lf2-modal-search input::placeholder { color: var(--ink-2); }
    .lf2-city-scroll { overflow-y: auto; margin: 0 -8px; padding: 0 8px 4px; }
    .lf2-city-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .lf2-city-tile {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      gap: 14px;
      padding: 4px 4px 14px;
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .lf2-city-tile:hover {
      border-color: #E8D5A0;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(168,133,76,0.14);
    }
    .lf2-city-tile.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(168,133,76,0.18);
    }
    .lf2-city-img { width: 100%; height: 80px; border-radius: 12px; }
    .lf2-city-img img { border-radius: 12px; }
    .lf2-city-name {
      font-size: 14px; font-weight: 500; line-height: 20px;
      color: var(--ink);
      text-align: center;
    }
    .lf2-city-check {
      position: absolute; top: 10px; right: 10px;
      width: 22px; height: 22px;
      border-radius: 999px;
      background: var(--gold);
      border: 2px solid var(--line);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .lf2-city-none {
      padding: 36px 0 20px;
      text-align: center;
      font-size: 14px; color: var(--ink-2);
    }

    /* ── Header label (replaces airport-btn) ── */
    .lf2-header-label { display: flex; flex-direction: column; gap: 2px; }
    .lf2-header-airport {
      font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;
    }
    .lf2-header-meta {
      font-size: 10.5px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--gold);
    }

    /* ── Hero (page top, light) ── */
    .lf2-hero-simple {
      padding: 48px 0 28px;
      max-width: 600px;
    }
    .lf2-hero-eyebrow-simple {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 14px;
    }
    .lf2-hero-title-simple {
      margin: 0;
      font-family: "DM Serif Display", Georgia, serif;
      font-weight: 400; font-size: 44px; line-height: 1.1;
      color: var(--ink); text-wrap: balance;
    }
    .lf2-hero-title-simple em { font-style: italic; color: var(--gold-dk); }
    .lf2-hero-sub-simple {
      margin: 16px 0 0;
      font-size: 15px; line-height: 1.6;
      color: var(--ink-2); max-width: 480px; text-wrap: pretty;
    }

    /* ── City search bar ── */
    .lf2-city-search {
      display: flex; align-items: center; gap: 10px;
      height: 50px; padding: 0 12px 0 16px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      max-width: 420px;
      margin-bottom: 20px;
      transition: border-color 0.15s;
    }
    .lf2-city-search:focus-within { border-color: var(--gold); }
    .lf2-city-search-icon { color: var(--ink-3); display: flex; flex-shrink: 0; }
    .lf2-city-search input {
      flex: 1; min-width: 0;
      border: 0; outline: 0; background: transparent;
      font-family: inherit; font-size: 14px; color: var(--ink);
    }
    .lf2-city-search input::placeholder { color: var(--ink-2); }
    .lf2-city-search-clear {
      width: 28px; height: 28px; border-radius: 999px;
      border: 0; background: var(--tile);
      color: var(--ink-2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .lf2-city-search-clear:hover { background: var(--line); }

    /* ── City grid (inline on page) ── */
    .lf2-city-section { margin-bottom: 48px; }
    .lf2-city-grid-inline {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px;
    }
    .lf2-city-tile {
      position: relative;
      display: flex; flex-direction: column; align-items: center;
      gap: 10px;
      padding: 4px 4px 12px;
      background: var(--tile);
      border: 1px solid var(--line);
      border-radius: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .lf2-city-tile:hover {
      border-color: #E8D5A0;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(168,133,76,0.14);
    }
    .lf2-city-tile.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(168,133,76,0.18);
    }
    .lf2-city-img { width: 100%; height: 88px; border-radius: 10px; }
    .lf2-city-img img { border-radius: 10px; }
    .lf2-city-name {
      font-size: 14px; font-weight: 600; line-height: 1.2;
      color: var(--ink); text-align: center;
    }
    .lf2-city-count {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--gold);
    }
    .lf2-city-check {
      position: absolute; top: 10px; right: 10px;
      width: 22px; height: 22px; border-radius: 999px;
      background: var(--gold); border: 2px solid #fff;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
    }
    .lf2-city-none {
      padding: 36px 0 20px;
      font-size: 14px; color: var(--ink-2);
    }

    /* ── City gradient fallback ── */
    .lf2-city-gradient {
      display: flex; align-items: center; justify-content: center;
    }
    .lf2-city-initial {
      font-family: "DM Serif Display", Georgia, serif;
      font-size: 36px; font-weight: 400;
      color: rgba(255,255,255,0.85);
      line-height: 1;
    }

    /* ── Minimal lounge cards (no photo) ── */
    .lf2-card-min-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }
    .lf2-card-min {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex; flex-direction: column;
      transition: box-shadow 0.18s, transform 0.18s, border-color 0.18s;
    }
    .lf2-card-min:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.08);
      border-color: #E8D5A0;
    }
    .lf2-card-min-header {
      padding: 22px 20px 18px;
      border-bottom: 1px solid var(--line);

    .lf2-card-min-amenity {

    .lf2-card-min-amenity span:last-child {

    /* ── Results section divider ── */
    .lf2-results { padding-top: 8px; }
    .lf2-prompt {

      padding: 40px 0 60px;
    }
    .lf2-prompt-line { flex: 1; height: 1px; background: var(--line); }
    .lf2-prompt-text {
      font-size: 13px; font-weight: 500;
      color: var(--ink-3); white-space: nowrap;
      letter-spacing: 0.02em;

    .lf2-hero {
      position: relative;

      background:
        radial-gradient(90% 140% at 100% 0%, rgba(168,133,76,0.35) 0%, transparent 55%),
        radial-gradient(60% 100% at 0% 100%, rgba(168,133,76,0.16) 0%, transparent 55%),
        linear-gradient(160deg, var(--brown-2) 0%, var(--brown) 60%);
      border-radius: 16px;
      padding: 36px 40px;
      overflow: hidden;
      color: #FFF8EC;
      margin-bottom: 4px;
    }
    .lf2-hero::after {
      content: '';
      position: absolute; right: -60px; top: -60px;

      border: 1px solid rgba(243,234,208,0.18);
      border-radius: 50%;
      pointer-events: none;

    .lf2-hero-eyebrow {
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: #D9BC7C; margin-bottom: 12px;

    .lf2-hero-title {
      margin: 0;
      font-family: "DM Serif Display", Georgia, serif;

      letter-spacing: 0.01em; max-width: 640px; text-wrap: balance;
    }
    .lf2-hero-sub {
      margin: 14px 0 0;
      font-size: 14px; line-height: 1.55;
      color: rgba(255,248,236,0.72);
      max-width: 440px; text-wrap: pretty;
    }
    .lf2-hero-change {
      flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 8px;
      height: 44px; padding: 0 20px;
      border-radius: 8px;
      border: 1px solid rgba(243,234,208,0.35);
      background: rgba(255,248,236,0.06);
      color: #F3EAD0;
      font-family: inherit; font-size: 14px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;

    @media (max-width: 760px) {
      .lf2-header-inner { padding: 0 16px; gap: 12px; }

      .lf2-hero { flex-direction: column; padding: 26px 22px; }
      .lf2-hero-title { font-size: 27px; }

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="lounge-data.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="lounge-finder-v2.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "cardStyle": "grid"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      return (
        <>
          <LoungeFinderV2 cardStyle={t.cardStyle} />
          <TweaksPanel title="Tweaks">
            <TweakSection label="Lounge list" />
            <TweakRadio label="Layout" value={t.cardStyle}
              options={[
                { value: 'grid',    label: 'Cards (with photo)' },
                { value: 'minimal', label: 'Cards (no photo)' },
                { value: 'list',    label: 'List' },
              ]}
              onChange={(v) => setTweak('cardStyle', v)} />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
