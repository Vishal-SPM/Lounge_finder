<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lounge Finder – Elite Assist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page-bg:      #EDE8E2;
      --bg:           #FFFFFF;
      --bg-warm:      #FAF7F2;
      --primary:      #A8854C;
      --primary-dk:   #8A6A35;
      --primary-lt:   #FBF5E8;
      --cream:        #F7EDD5;
      --cream-bd:     #E8D5A0;
      --text:         #1A1614;
      --text-2:       #5C5752;
      --muted:        #A09890;
      --border:       #E8E3DA;
      --r-sm:  10px;
      --r-md:  16px;
      --r-lg:  20px;
      --r-xl:  24px;
      --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--page-bg);
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      min-height: 100vh;
      padding: 20px 16px 48px;
    }

    /* ═══ Page Container ═══ */
    .page-wrap {
      max-width: 1440px;
      margin: 0 auto;
      background: var(--bg);
      border-radius: var(--r-xl);
      overflow: hidden;
      box-shadow: 0 8px 48px rgba(0,0,0,0.10);
    }

    /* ═══ Header / Nav ═══ */
    header {
      padding: 0 32px;
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 200;
    }

    /* Brand */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 90px;
    }
    .brand-logo {
      color: var(--primary);
      display: block;
      line-height: 1;
    }
    .brand-logo svg { display: block; }
    .brand-name {
      font-size: 8.5px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--primary);
    }

    /* Center: airport selector pill */
    .nav-airport {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: var(--r-sm);
      transition: background 0.15s;
      user-select: none;
    }
    .nav-airport:hover { background: var(--cream); }
    .nav-airport-name {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .nav-airport-name svg { width: 14px; height: 14px; color: var(--text-2); transition: transform 0.2s; }
    .nav-airport.open .nav-airport-name svg { transform: rotate(180deg); }
    .nav-airport-meta {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--primary);
      margin-top: 2px;
    }

    /* Right icon buttons */
    .nav-actions { display: flex; gap: 10px; min-width: 90px; justify-content: flex-end; }
    .nav-icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-2);
      transition: border-color 0.15s, background 0.15s;
    }
    .nav-icon-btn:hover { border-color: var(--cream-bd); background: var(--cream); color: var(--primary); }
    .nav-icon-btn svg { width: 17px; height: 17px; }

    /* ═══ Selector Section ═══ */
    .selector-section {
      padding: 32px 40px 28px;
      background: var(--bg-warm);
      border-bottom: 1px solid var(--border);
    }
    .selector-header { margin-bottom: 20px; }
    .selector-header h2 { font-size: 19px; font-weight: 700; }
    .selector-header p  { font-size: 13px; color: var(--text-2); margin-top: 4px; line-height: 1.5; }

    /* Search */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      padding: 0 20px;
      height: 52px;
      margin-bottom: 24px;
      transition: border-color 0.15s;
    }
    .search-wrap:focus-within { border-color: var(--primary); }
    .search-wrap svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
    .search-wrap input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      background: transparent;
      color: var(--text);
    }
    .search-wrap input::placeholder { color: var(--muted); }

    /* City Grid */
    .city-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .city-card {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
      box-shadow: var(--shadow-sm);
    }
    .city-card:hover {
      border-color: var(--cream-bd);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .city-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(155,120,53,0.15);
    }
    .city-card-img-wrap {
      position: relative;
      height: 130px;
      overflow: hidden;
      background: #ddd;
    }
    .city-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s, opacity 0.3s;
      opacity: 0;
    }
    .city-card-img.loaded { opacity: 1; }
    .city-card:hover .city-card-img { transform: scale(1.05); }
    .city-card-img-shimmer {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #e2ddd6 25%, #eee9e1 50%, #e2ddd6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      transition: opacity 0.3s;
    }
    .city-card-img-shimmer.gone { opacity: 0; pointer-events: none; }
    .city-card-check {
      position: absolute;
      top: 8px; right: 8px;
      width: 26px; height: 26px;
      background: var(--primary);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .city-card.selected .city-card-check { display: flex; }
    .city-card-check svg { width: 14px; height: 14px; color: #fff; }
    .city-card-label {
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }
    .city-card.selected .city-card-label {
      background: var(--cream);
      color: var(--primary);
    }
    .city-card-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      display: block;
      margin-top: 1px;
    }
    .city-card.selected .city-card-count { color: var(--primary); opacity: 0.8; }
    .city-no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 14px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ═══ Filter Strip ═══ */
    .filter-strip {
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      display: none;
    }
    .filter-strip.visible { display: block; }

    .selected-airport-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--cream);
      border: 1.5px solid var(--cream-bd);
      border-radius: var(--r-md);
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .sap-icon {
      width: 36px; height: 36px;
      background: var(--primary-lt);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .sap-icon svg { width: 18px; height: 18px; color: var(--primary); }
    .sap-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .sap-meta { font-size: 11px; font-weight: 600; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; }
    .sap-clear {
      margin-left: auto;
      width: 28px; height: 28px;
      background: rgba(155,120,53,0.1);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
      font-size: 14px;
      transition: background 0.15s;
    }
    .sap-clear:hover { background: rgba(155,120,53,0.2); }

    .filter-groups {
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
    }
    .filter-group { flex: 1; min-width: 180px; }
    .filter-group-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }
    .radio-pills { display: flex; flex-direction: column; gap: 8px; }
    .radio-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-2);
      background: var(--bg);
    }
    .radio-pill:hover { border-color: var(--cream-bd); background: var(--cream); color: var(--text); }
    .radio-pill.active { border-color: var(--primary); background: var(--cream); color: var(--text); }
    .radio-circle {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s;
    }
    .radio-pill.active .radio-circle { border-color: var(--primary); }
    .radio-dot {
      width: 10px; height: 10px;
      background: var(--primary);
      border-radius: 50%;
      display: none;
    }
    .radio-pill.active .radio-dot { display: block; }

    /* horizontal layout for 2-option groups */
    .radio-pills.horizontal { flex-direction: row; }
    .radio-pills.horizontal .radio-pill { flex: 1; }

    /* ═══ Results Section ═══ */
    .results-section {
      padding: 28px 40px 40px;
    }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .results-title {
      font-size: 16px;
      font-weight: 700;
    }
    .results-count {
      font-size: 13px;
      color: var(--muted);
    }

    /* City section dividers */
    .city-section-head {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      margin-bottom: 2px;
    }
    .city-section-head span {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      white-space: nowrap;
    }
    .city-section-head::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ═══ Lounge Grid ═══ */
    .lounge-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* ═══ Lounge Card ═══ */
    .lcard {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .lcard:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }

    /* image */
    .lcard-img-wrap {
      position: relative;
      height: 185px;
      overflow: hidden;
      background: #ddd;
    }
    .lcard-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s, opacity 0.3s;
      opacity: 0;
    }
    .lcard-img.loaded { opacity: 1; }
    .lcard:hover .lcard-img { transform: scale(1.04); }
    .lcard-img-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, #ddd8d0 25%, #eae5dd 50%, #ddd8d0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      transition: opacity 0.3s;
    }
    .lcard-img-shimmer.gone { opacity: 0; pointer-events: none; }
    /* type badge on image */
    .lcard-badge {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(0,0,0,0.52);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 3px 9px;
      border-radius: 6px;
    }

    /* body */
    .lcard-body {
      padding: 16px 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .lcard-name {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
    }
    .lcard-loc {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 3px;
      line-height: 1.4;
    }

    /* amenities */
    .lcard-amenities {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .amenity {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 48px;
    }
    .amenity-icon {
      width: 32px; height: 32px;
      color: var(--primary);
    }
    .amenity-icon svg { width: 100%; height: 100%; }
    .amenity-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-2);
      text-align: center;
      line-height: 1.2;
    }

    /* info rows */
    .lcard-info { display: flex; flex-direction: column; gap: 7px; }
    .lcard-info-row {
      background: var(--cream);
      border-radius: var(--r-sm);
      padding: 9px 12px;
      font-size: 12px;
      color: var(--text-2);
      font-weight: 500;
      text-align: center;
    }

    /* CTA */
    .lcard-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: #fff;
      padding: 12px 18px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s;
      margin-top: auto;
    }
    .lcard-cta:hover { background: var(--primary-dk); }
    .lcard-cta svg { width: 14px; height: 14px; }

    /* ═══ Empty State ═══ */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 32px;
      color: var(--muted);
    }
    .empty-state svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.35; }
    .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text-2); }
    .empty-state p  { font-size: 13px; }

    /* ═══ Card Gate ═══ */
    .card-gate {
      padding: 64px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-warm);
    }
    .card-gate-box {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .card-gate-icon {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      background: var(--primary-lt);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--primary);
    }
    .card-gate-icon svg { width: 26px; height: 26px; }
    .card-gate-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .card-gate-box p { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-bottom: 28px; }
    .card-input-wrap {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 50px;
      padding: 0 22px;
      height: 52px;
      transition: border-color 0.15s;
    }
    .card-input-wrap:focus-within { border-color: var(--primary); }
    .card-input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 4px;
      text-align: center;
      color: var(--text);
      font-family: inherit;
    }
    .card-input-wrap input::placeholder { color: var(--muted); letter-spacing: 4px; }
    .card-gate-error {
      min-height: 18px;
      font-size: 12px;
      font-weight: 500;
      color: #B3453F;
      margin-top: 10px;
    }
    .card-gate-btn {
      width: 100%;
      margin-top: 20px;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 14px 18px;
      border-radius: var(--r-sm);
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .card-gate-btn:hover:not(:disabled) { background: var(--primary-dk); }
    .card-gate-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ═══ Card Pill (selector section, once verified) ═══ */
    .card-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--cream);
      border: 1.5px solid var(--cream-bd);
      border-radius: var(--r-md);
      padding: 12px 16px;
      margin-bottom: 20px;
    }
    .card-pill-icon {
      width: 36px; height: 36px;
      background: var(--primary-lt);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--primary);
    }
    .card-pill-icon svg { width: 18px; height: 18px; }
    .card-pill-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .card-pill-meta { font-size: 11px; font-weight: 600; color: var(--primary); letter-spacing: 0.5px; text-transform: uppercase; margin-top: 2px; }
    .card-pill-change {
      margin-left: auto;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      text-decoration: underline;
      font-family: inherit;
    }

    .hidden-until-card { display: none !important; }

    /* ═══ Responsive ═══ */
    @media (max-width: 900px) {
      header, .selector-section, .filter-strip, .results-section { padding-left: 24px; padding-right: 24px; }
      .city-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
    @media (max-width: 600px) {
      body { padding: 10px 8px 32px; }
      header, .selector-section, .filter-strip, .results-section { padding-left: 16px; padding-right: 16px; }
      .filter-groups { flex-direction: column; gap: 16px; }
      .radio-pills.horizontal { flex-direction: column; }
      .lounge-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="page-wrap">

  <!-- ═══ Header / Nav ═══ -->
  <header>

    <!-- Brand -->
    <div class="brand">
      <div class="brand-logo">
        <img src="EA%20logo.png" alt="Elite Assist" height="36" style="display:block;" />
      </div>
    </div>

    <!-- Center: current airport -->
    <div class="nav-airport hidden-until-card" id="navAirport" title="Change airport">
      <div class="nav-airport-name">
        <span id="navAirportName">Select Airport</span>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
        </svg>
      </div>
      <div class="nav-airport-meta" id="navAirportMeta"></div>
    </div>

    <!-- Right: spacer for layout balance -->
    <div class="nav-actions hidden-until-card" id="navActions"></div>

  </header>

  <!-- ═══ Card Gate ═══ -->
  <section class="card-gate" id="cardGate">
    <div class="card-gate-box">
      <div class="card-gate-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      </div>
      <h2>Find Your Lounge Access</h2>
      <p>Enter the first 9 digits of your card number to check your lounge eligibility.</p>
      <div class="card-input-wrap">
        <input id="cardInput" type="text" inputmode="numeric" maxlength="9" placeholder="000000000" autocomplete="off" spellcheck="false" />
      </div>
      <div class="card-gate-error" id="cardGateError"></div>
      <button class="card-gate-btn" id="cardGateBtn" disabled>Continue</button>
    </div>
  </section>

  <!-- ═══ Airport Selector ═══ -->
  <div id="mainContent" class="hidden-until-card">
  <section class="selector-section">
    <div class="card-pill" id="cardPill">
      <div class="card-pill-icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>

const GATED_IDS = ['navAirport', 'navActions', 'mainContent'];

function matchCardBin(digits) {
  return CARD_BINS.find(b => digits.startsWith(b.prefix)) || null;
}

function showApp() {
  GATED_IDS.forEach(id => document.getElementById(id).classList.remove('hidden-until-card'));
  document.getElementById('cardGate').style.display = 'none';
  document.getElementById('cardPillName').textContent = selCard.name;
}

function hideApp() {
  GATED_IDS.forEach(id => document.getElementById(id).classList.add('hidden-until-card'));
  document.getElementById('cardGate').style.display = '';
}

const cardInput     = document.getElementById('cardInput');
const cardGateBtn   = document.getElementById('cardGateBtn');
const cardGateError = document.getElementById('cardGateError');

cardInput.addEventListener('input', () => {
  cardInput.value = cardInput.value.replace(/\D/g, '').slice(0, 9);
  cardGateError.textContent = '';
  cardGateBtn.disabled = cardInput.value.length !== 9;
});

cardInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !cardGateBtn.disabled) cardGateBtn.click();
});

cardGateBtn.addEventListener('click', () => {
  const match = matchCardBin(cardInput.value);
  if (!match) {
    cardGateError.textContent = "We couldn't recognize this card number. Please check and try again.";
    return;
  }
  selCard = match;
  showApp();
});

document.getElementById('cardPillChange').addEventListener('click', () => {
  selCard = null;
  selCity = null;
  selTerminal = 'all';
  cardInput.value = '';
  cardGateBtn.disabled = true;
  cardGateError.textContent = '';
  hideApp();
  renderCityGrid();
  applyFilters();
  cardInput.focus();
});

/* ══════════════════════════════════════
   CITY GRID
══════════════════════════════════════ */
function renderCityGrid(query = '') {
  const q = query.toLowerCase().trim();
  const filtered = cities.filter(c => c.toLowerCase().includes(q));
  const grid = document.getElementById('cityGrid');

  if (!filtered.length) {
    grid.innerHTML = `<div class="city-no-results">No airports match "<strong>${query}</strong>"</div>`;
    return;
  }

  grid.innerHTML = filtered.map(city => {
    const imgUrl = CITY_IMAGES[city] || 'https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=400&h=260&q=75';
    const shId = 'csh-' + h32(city);
    const isSelected = city === selCity;
    return `
    <div class="city-card ${isSelected ? 'selected' : ''}" data-city="${city}">
      <div class="city-card-img-wrap">
        <div class="city-card-img-shimmer" id="${shId}"></div>
        <img class="city-card-img" src="${imgUrl}" alt="${city}"
          onload="this.classList.add('loaded');document.getElementById('${shId}').classList.add('gone')"
          onerror="document.getElementById('${shId}').classList.add('gone')" />
        <div class="city-card-check">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>
        </div>
      </div>
      <div class="city-card-label">
        ${city}
        <span class="city-card-count">${cityCounts[city]} lounge${cityCounts[city] > 1 ? 's' : ''}</span>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('cityGrid').addEventListener('click', e => {
  const card = e.target.closest('.city-card');
  if (!card) return;
  const city = card.dataset.city;
  if (selCity === city) return;
  selCity = city;
  selTerminal = 'all';
  renderCityGrid(document.getElementById('citySearch').value);
  renderFilterStrip();
  applyFilters();
});

document.getElementById('citySearch').addEventListener('input', e => {
  renderCityGrid(e.target.value);
});

/* ══════════════════════════════════════
   FILTER STRIP
══════════════════════════════════════ */
function renderFilterStrip() {
  const strip = document.getElementById('filterStrip');
  if (!selCity) { strip.classList.remove('visible'); return; }
  strip.classList.add('visible');

  const cityLounges = lounges.filter(l => l.city === selCity);
  const airport = cityLounges[0].airport;
  const terminals = [...new Set(cityLounges.map(l => l.terminal))].sort();

  /* airport pill */
  document.getElementById('sapName').textContent = airport;
  document.getElementById('sapMeta').textContent = selTerminal !== 'all' ? selTerminal : 'All Terminals';

  /* terminal pills */
  const tGroup = document.getElementById('terminalGroup');
  const tPills = document.getElementById('terminalPills');
  if (terminals.length > 1) {
    tGroup.style.display = '';
    tPills.innerHTML = [
      { val:'all', label:'All Terminals' },
      ...terminals.map(t => ({ val: t, label: 'Terminal ' + t.replace('T','') }))
    ].map(o => `
      <label class="radio-pill ${selTerminal === o.val ? 'active' : ''}" data-val="${o.val}">
        ${o.label}
        <span class="radio-circle"><span class="radio-dot"></span></span>
      </label>`).join('');
  } else {
    tGroup.style.display = 'none';
  }

}

/* Terminal pills (dynamic) */
document.getElementById('terminalPills').addEventListener('click', e => {
  const pill = e.target.closest('.radio-pill');
  if (!pill) return;
  selTerminal = pill.dataset.val;
  renderFilterStrip();
  applyFilters();
});
/* Clear city */
document.getElementById('clearCity').addEventListener('click', () => {
  selCity = null; selTerminal = 'all';
  renderCityGrid(document.getElementById('citySearch').value);
  renderFilterStrip();
  applyFilters();
});

/* ══════════════════════════════════════
   LOUNGE CARDS
══════════════════════════════════════ */
function renderLounge(l) {
  const key = l.city + l.name;
  const imgUrl = LOUNGE_IMGS[h32(key) % LOUNGE_IMGS.length];
  const shId = 'lsh-' + h32(key);
  const amenities = getAmenities();
  const gateLabel = l.gate === 'both' ? 'Dep & Arrival' : l.gate.charAt(0).toUpperCase() + l.gate.slice(1);
  const locLine = `${gateLabel} · ${l.terminal} · ${l.location.charAt(0).toUpperCase() + l.location.slice(1)}`;

  return `
  <div class="lcard">
    <div class="lcard-img-wrap">
      <div class="lcard-img-shimmer" id="${shId}"></div>
      <img class="lcard-img" src="${imgUrl}" alt="${l.name}"
        onload="this.classList.add('loaded');document.getElementById('${shId}').classList.add('gone')"
        onerror="document.getElementById('${shId}').classList.add('gone')" />
      <span class="lcard-badge">${l.type === 'domestic' ? 'Domestic' : 'International'}</span>
    </div>
    <div class="lcard-body">
      <div>
        <div class="lcard-name">${l.name}</div>
        <div class="lcard-loc">${l.airport} · ${locLine}</div>
      </div>
      <div class="lcard-amenities">
        ${amenities.map(a => `
        <div class="amenity">
          <div class="amenity-icon">${a.svg}</div>
          <span class="amenity-label">${a.label}</span>
        </div>`).join('')}
      </div>
      <div class="lcard-info">
        <div class="lcard-info-row">Includes up to 2 hours of lounge access</div>
      </div>
      <a href="${l.url}" target="_blank" rel="noopener" class="lcard-cta">
        Access Lounge
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </a>
    </div>
  </div>`;
}

function syncNavHeader() {
  const nameEl = document.getElementById('navAirportName');
  const metaEl = document.getElementById('navAirportMeta');
  if (!selCity) {
    nameEl.textContent = 'Select City';
    metaEl.textContent = '';
    return;
  }
  const f = lounges.find(l => l.city === selCity);
  nameEl.textContent = f.airport;
  metaEl.textContent = selTerminal !== 'all' ? selTerminal : 'All Terminals';
}

function applyFilters() {
  syncNavHeader();
  const grid = document.getElementById('loungeGrid');

  if (!selCity) {
    document.getElementById('resultsTitle').textContent = '';
    document.getElementById('resultsCount').textContent = '';
    grid.innerHTML = `<div class="empty-state">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
      <h3>Select a city to explore lounges</h3>
      <p>Choose your departure city from the grid above.</p>
    </div>`;
    return;
  }

  let result = lounges.filter(l => l.city === selCity);
  if (selTerminal !== 'all') result = result.filter(l => l.terminal === selTerminal);

  const n = result.length;
  document.getElementById('resultsCount').textContent = `${n} lounge${n !== 1 ? 's' : ''} found`;
  document.getElementById('resultsTitle').textContent = `Lounges in ${selCity}`;

  if (!n) {
    grid.innerHTML = `<div class="empty-state">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <h3>No lounges found</h3>
      <p>Try adjusting your filters or selecting a different terminal.</p>
    </div>`;
    return;
  }

  grid.innerHTML = result.map(renderLounge).join('');
}

/* Clicking nav airport scrolls to selector & focuses search */
document.getElementById('navAirport').addEventListener('click', () => {
  document.querySelector('.selector-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => document.getElementById('citySearch').focus(), 380);
});

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
renderCityGrid();
applyFilters();
</script>
</body>
</html>
